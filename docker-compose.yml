# Aerial Survey Manager - Docker Compose Configuration
# 온프레미스 배포용

# 공통 로그 설정 (디스크 용량 관리)
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

# 처리 워커용 로그 설정 (디버깅 중요 - 더 큰 용량)
x-logging-worker: &worker-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

services:
  # === Frontend (React) ===
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_URL=
        - VITE_MAP_OFFLINE=${VITE_MAP_OFFLINE:-false}
        - VITE_TILE_URL=${VITE_TILE_URL:-}
    expose:
      - "80"
      - "5173" # Vite dev port
    environment:
      - VITE_API_URL=
      - VITE_MAP_OFFLINE=${VITE_MAP_OFFLINE:-false}
      - VITE_TILE_URL=${VITE_TILE_URL:-}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - api
    networks:
      - aerial-network
    logging: *default-logging

  # === Backend API (FastAPI) ===
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    user: "${AERIAL_CONTAINER_UID:-1000}:${AERIAL_CONTAINER_GID:-1000}"
    ports:
      - "${AERIAL_DEV_API_BIND:-127.0.0.1}:${AERIAL_DEV_API_PORT:-18101}:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/aerial_survey
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_BACKEND=${STORAGE_BACKEND:-minio}
      - LOCAL_STORAGE_PATH=/data/storage
      - PROCESSING_DATA_PATH=/data/processing
      - EXPORT_ROOT_PATH=/data/exports
      - MEDIA_STORAGE_ROOT=${MEDIA_STORAGE_ROOT:-/media}
      - SYSTEM_STORAGE_PATH=${SYSTEM_STORAGE_PATH:-/}
      - FILESYSTEM_ALLOWED_ROOTS=${FILESYSTEM_ALLOWED_ROOTS:-/media}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=aerial-survey
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-only-jwt-secret-key-at-least-32-bytes}
      - ALLOW_WEAK_JWT_SECRET=true
      # 개발 환경 전용 기본 계정. 운영 Compose에는 기본 비밀번호가 없습니다.
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-siqms}
      - ADMIN_NAME=${ADMIN_NAME:-관리자}
      - ALLOW_WEAK_ADMIN_PASSWORD=${ALLOW_WEAK_ADMIN_PASSWORD:-true}
      - ENABLE_METASHAPE_ENGINE=${ENABLE_GPU_ENGINE:-${ENABLE_METASHAPE_ENGINE:-true}}
      - ENABLE_ODM_ENGINE=${ENABLE_ODM_ENGINE:-false}
      - ENABLE_EXTERNAL_ENGINE=${ENABLE_EXTERNAL_ENGINE:-false}
      - EXTERNAL_ENGINE_URL=${EXTERNAL_ENGINE_URL:-}
      - EXTERNAL_ENGINE_API_KEY=${EXTERNAL_ENGINE_API_KEY:-}
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT:-localhost:${AERIAL_DEV_WEB_PORT:-18110}}
      - COG_LOOKUP_WARN_MS=${COG_LOOKUP_WARN_MS:-1000}
    volumes:
      - ./backend:/app
      - ${PROCESSING_DATA_PATH:-${DATA_PATH:-./data}/processing}:/data/processing
      - ${LOCAL_STORAGE_PATH:-${DATA_PATH:-./data}/storage}/projects:/data/storage/projects
      - ${EXPORT_ROOT_PATH:-${DATA_PATH:-./data}/storage/orthomosaic}:/data/storage/orthomosaic
      - ${EXPORT_ROOT_PATH:-${DATA_PATH:-./data}/storage/orthomosaic}:/data/exports
      - ${MINIO_DATA_PATH:-${DATA_PATH:-./data}}:/data/minio:ro
      - ${TILES_PATH:-/data/tiles}:/data/tiles:ro
      # 권역 GeoJSON 데이터 (초기 시드용)
      - ${SEED_DATA_PATH:-./data}:/app/data:ro
      # 호스트 파일시스템 접근 (로컬 이미지 불러오기용)
      # rslave: 외장하드 핫플러그 시 컨테이너에 실시간 반영
      - type: bind
        source: /media
        target: /media
        read_only: true
        bind:
          propagation: rslave
      - /mnt:/mnt:ro
      - /run/media:/run/media:ro
      - /home:/home:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - aerial-network
    logging: *default-logging

  # === Celery Worker - ODM Queue (DISABLED - using GPU engine only) ===
  # worker-odm:
  #   build:
  #     context: .
  #     dockerfile: engines/odm/Dockerfile
  #   command: celery -A app.workers.tasks worker -Q odm --loglevel=info --concurrency=2
  #   environment:
  #     - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/aerial_survey
  #     - REDIS_URL=redis://redis:6379/0
  #     - MINIO_ENDPOINT=minio:9000
  #     - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
  #     - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
  #     - MINIO_BUCKET=aerial-survey
  #     - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT:-localhost:${AERIAL_DEV_WEB_PORT:-18110}}
  #     - HOST_DATA_PATH=${PROCESSING_DATA_PATH:-${PWD}/data/processing}
  #   volumes:
  #     - ./backend/app:/app/app
  #     - ${PROCESSING_DATA_PATH:-${DATA_PATH:-./data}/processing}:/data/processing
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   depends_on:
  #     - redis
  #     - db
  #     - minio
  #   restart: always
  #   networks:
  #     - aerial-network
  #   logging: *worker-logging

  # === Celery Worker - External API Queue (DISABLED - using GPU engine only) ===
  # worker-external:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   command: celery -A app.workers.tasks worker -Q external --loglevel=info --concurrency=4
  #   environment:
  #     - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/aerial_survey
  #     - REDIS_URL=redis://redis:6379/0
  #     - MINIO_ENDPOINT=minio:9000
  #     - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
  #     - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
  #     - MINIO_BUCKET=aerial-survey
  #     - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT:-localhost:${AERIAL_DEV_WEB_PORT:-18110}}
  #     - EXTERNAL_ENGINE_URL=${EXTERNAL_ENGINE_URL:-}
  #     - EXTERNAL_ENGINE_API_KEY=${EXTERNAL_ENGINE_API_KEY:-}
  #   volumes:
  #     - ./backend/app:/app/app
  #     - ${PROCESSING_DATA_PATH:-${DATA_PATH:-./data}/processing}:/data/processing
  #   depends_on:
  #     - redis
  #     - db
  #   networks:
  #     - aerial-network
  #   logging: *default-logging

  # === Celery Worker - GPU Processing Engine ===
  worker-engine:
    container_name: aerial-worker-engine
    build:
      context: .
      dockerfile: engines/metashape/Dockerfile
    working_dir: /app
    command: celery -A app.workers.tasks worker -Q ${PROCESSING_ENGINE_QUEUE:-gpu-engine} --loglevel=info --concurrency=1 -n worker-engine@%h
    restart: always
    # Graceful shutdown (라이센스는 유지됨 - 오프라인 환경 지원)
    stop_signal: SIGTERM
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD-SHELL", "nvidia-smi -L >/dev/null 2>&1 && celery -A app.workers.tasks inspect ping -d worker-engine@$$HOSTNAME --timeout 20 | grep -q pong || exit 1"]
      interval: 120s
      timeout: 30s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/aerial_survey
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_BACKEND=${STORAGE_BACKEND:-minio}
      - LOCAL_STORAGE_PATH=/data/storage
      - PROCESSING_DATA_PATH=/data/processing
      - EXPORT_ROOT_PATH=/data/exports
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=aerial-survey
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-only-jwt-secret-key-at-least-32-bytes}
      - ALLOW_WEAK_JWT_SECRET=true
      - ENGINE_LICENSE_KEY=${ENGINE_LICENSE_KEY:-}
      - PROJECT_ID=${PROJECT_ID:-unknown}
      - PLATFORM_WEBHOOK_URL=http://api:8000/api/v1/processing/webhook
      - BACKEND_URL_ORTHO=http://api:8000/api/v1/processing
      - PROCESSING_QUEUE_WAIT_WARN_SECONDS=${PROCESSING_QUEUE_WAIT_WARN_SECONDS:-300}
      - PROCESSING_TOTAL_WARN_SECONDS=${PROCESSING_TOTAL_WARN_SECONDS:-7200}
      - PROCESSING_MEMORY_WARN_MB=${PROCESSING_MEMORY_WARN_MB:-8192}
      - ENABLE_EXTERNAL_COG_INGEST=${ENABLE_EXTERNAL_COG_INGEST:-false}
      - PROCESSING_ENGINE_QUEUE=${PROCESSING_ENGINE_QUEUE:-gpu-engine}
      - ENABLE_METASHAPE_ENGINE=${ENABLE_GPU_ENGINE:-${ENABLE_METASHAPE_ENGINE:-true}}
      - ENABLE_ODM_ENGINE=${ENABLE_ODM_ENGINE:-false}
      - ENABLE_EXTERNAL_ENGINE=${ENABLE_EXTERNAL_ENGINE:-false}
    volumes:
      - ./backend/app:/app/app
      - ./engines/metashape:/app/engines/metashape
      - ${PROCESSING_DATA_PATH:-${DATA_PATH:-./data}/processing}:/data/processing
      - ${LOCAL_STORAGE_PATH:-${DATA_PATH:-./data}/storage}/projects:/data/storage/projects
      - ${EXPORT_ROOT_PATH:-${DATA_PATH:-./data}/storage/orthomosaic}:/data/storage/orthomosaic
      - ${EXPORT_ROOT_PATH:-${DATA_PATH:-./data}/storage/orthomosaic}:/data/exports
      - engine-license:/var/tmp/agisoft/licensing
      # 호스트 파일시스템 접근 (로컬 이미지 symlink용)
      # rslave: 외장하드 핫플러그 시 컨테이너에 실시간 반영
      - type: bind
        source: /media
        target: /media
        read_only: true
        bind:
          propagation: rslave
      - /mnt:/mnt:ro
      - /run/media:/run/media:ro
      - /home:/home:ro
    depends_on:
      - redis
      - db
    networks:
      aerial-network:
        aliases:
          - worker-engine
    mac_address: "02:42:AC:17:00:64"  # Static MAC for stable Machine ID
    logging: *worker-logging

  # === Celery Beat (Scheduler) ===
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.workers.tasks beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    user: "${AERIAL_CONTAINER_UID:-1000}:${AERIAL_CONTAINER_GID:-1000}"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/aerial_survey
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_BACKEND=${STORAGE_BACKEND:-minio}
      - LOCAL_STORAGE_PATH=/data/storage
      - PROCESSING_DATA_PATH=/data/processing
      - EXPORT_ROOT_PATH=/data/exports
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT:-localhost:${AERIAL_DEV_WEB_PORT:-18110}}
    volumes:
      - ./backend:/app
      - ${LOCAL_STORAGE_PATH:-${DATA_PATH:-./data}/storage}/projects:/data/storage/projects
      - ${EXPORT_ROOT_PATH:-${DATA_PATH:-./data}/storage/orthomosaic}:/data/storage/orthomosaic
      - ${EXPORT_ROOT_PATH:-${DATA_PATH:-./data}/storage/orthomosaic}:/data/exports
    depends_on:
      - redis
    networks:
      - aerial-network
    logging: *default-logging

  # === Celery Worker - 썸네일 전용 (처리 중에도 동시 실행) ===
  celery-worker-thumbnail:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.workers.tasks worker -Q thumbnail --loglevel=info --concurrency=1 -n worker-thumbnail@%h
    restart: always
    user: "${AERIAL_CONTAINER_UID:-1000}:${AERIAL_CONTAINER_GID:-1000}"
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.tasks inspect ping -d worker-thumbnail@$$HOSTNAME --timeout 10 | grep -q pong || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/aerial_survey
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_BACKEND=${STORAGE_BACKEND:-minio}
      - LOCAL_STORAGE_PATH=/data/storage
      - PROCESSING_DATA_PATH=/data/processing
      - EXPORT_ROOT_PATH=/data/exports
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=aerial-survey
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT:-localhost:${AERIAL_DEV_WEB_PORT:-18110}}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-only-jwt-secret-key-at-least-32-bytes}
      - ALLOW_WEAK_JWT_SECRET=true
    volumes:
      - ./backend:/app
      - ${LOCAL_STORAGE_PATH:-${DATA_PATH:-./data}/storage}/projects:/data/storage/projects
      - ${EXPORT_ROOT_PATH:-${DATA_PATH:-./data}/storage/orthomosaic}:/data/storage/orthomosaic
      - ${EXPORT_ROOT_PATH:-${DATA_PATH:-./data}/storage/orthomosaic}:/data/exports
      - ${PROCESSING_DATA_PATH:-${DATA_PATH:-./data}/processing}:/data/processing
      # 호스트 파일시스템 접근 (로컬 이미지 썸네일 생성용)
      - type: bind
        source: /media
        target: /media
        read_only: true
        bind:
          propagation: rslave
      - /mnt:/mnt:ro
      - /run/media:/run/media:ro
      - /home:/home:ro
    depends_on:
      - redis
    networks:
      - aerial-network
    logging: *default-logging

  # === Celery Worker (파일관리, COG삽입 등) ===
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.workers.tasks worker -Q celery --loglevel=info --concurrency=2 -n worker-celery@%h
    restart: always
    user: "${AERIAL_CONTAINER_UID:-1000}:${AERIAL_CONTAINER_GID:-1000}"
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.tasks inspect ping -d worker-celery@$$HOSTNAME --timeout 10 | grep -q pong || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/aerial_survey
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_BACKEND=${STORAGE_BACKEND:-minio}
      - LOCAL_STORAGE_PATH=/data/storage
      - PROCESSING_DATA_PATH=/data/processing
      - EXPORT_ROOT_PATH=/data/exports
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=aerial-survey
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT:-localhost:${AERIAL_DEV_WEB_PORT:-18110}}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-only-jwt-secret-key-at-least-32-bytes}
      - ALLOW_WEAK_JWT_SECRET=true
      - PROCESSING_QUEUE_WAIT_WARN_SECONDS=${PROCESSING_QUEUE_WAIT_WARN_SECONDS:-300}
      - PROCESSING_TOTAL_WARN_SECONDS=${PROCESSING_TOTAL_WARN_SECONDS:-7200}
      - PROCESSING_MEMORY_WARN_MB=${PROCESSING_MEMORY_WARN_MB:-8192}
      - ENABLE_EXTERNAL_COG_INGEST=${ENABLE_EXTERNAL_COG_INGEST:-false}
      - PROCESSING_ENGINE_QUEUE=${PROCESSING_ENGINE_QUEUE:-gpu-engine}
      - ENABLE_METASHAPE_ENGINE=${ENABLE_GPU_ENGINE:-${ENABLE_METASHAPE_ENGINE:-true}}
      - ENABLE_ODM_ENGINE=${ENABLE_ODM_ENGINE:-false}
      - ENABLE_EXTERNAL_ENGINE=${ENABLE_EXTERNAL_ENGINE:-false}
    volumes:
      - ./backend:/app
      - ${LOCAL_STORAGE_PATH:-${DATA_PATH:-./data}/storage}/projects:/data/storage/projects
      - ${EXPORT_ROOT_PATH:-${DATA_PATH:-./data}/storage/orthomosaic}:/data/storage/orthomosaic
      - ${EXPORT_ROOT_PATH:-${DATA_PATH:-./data}/storage/orthomosaic}:/data/exports
      - ${PROCESSING_DATA_PATH:-${DATA_PATH:-./data}/processing}:/data/processing
      # 호스트 파일시스템 접근 (로컬 이미지 썸네일 생성용)
      # rslave: 외장하드 핫플러그 시 컨테이너에 실시간 반영
      - type: bind
        source: /media
        target: /media
        read_only: true
        bind:
          propagation: rslave
      - /mnt:/mnt:ro
      - /run/media:/run/media:ro
      - /home:/home:ro
    depends_on:
      - redis
    networks:
      - aerial-network
    logging: *default-logging

  # === PostgreSQL + PostGIS ===
  db:
    image: postgis/postgis:15-3.3
    restart: always
    environment:
      - POSTGRES_DB=aerial_survey
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${AERIAL_DEV_DB_BIND:-127.0.0.1}:${AERIAL_DEV_DB_PORT:-18132}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aerial-network
    logging: *default-logging

  # === Redis ===
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "${AERIAL_DEV_REDIS_BIND:-127.0.0.1}:${AERIAL_DEV_REDIS_PORT:-18179}:6379"
    volumes:
      - redis_data:/data
    networks:
      - aerial-network
    logging: *default-logging

  # === MinIO (S3-compatible Storage) ===
  # 로컬 모드(STORAGE_BACKEND=local)에서는 불필요 - profiles로 선택적 시작
  # MinIO 모드: docker compose --profile minio up (또는 COMPOSE_PROFILES=minio)
  minio:
    image: minio/minio:latest
    profiles: ["minio"]
    restart: always
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_API_CORS_ALLOW_ORIGIN=*
    ports:
      - "${AERIAL_DEV_MINIO_BIND:-127.0.0.1}:${AERIAL_DEV_MINIO_PORT:-18102}:9000"
      - "${AERIAL_DEV_MINIO_CONSOLE_BIND:-127.0.0.1}:${AERIAL_DEV_MINIO_CONSOLE_PORT:-18103}:9001"  # Console UI
    volumes:
      - ${MINIO_DATA_PATH:-${DATA_PATH:-./data}}:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - aerial-network
    logging: *default-logging

  # === MinIO Bucket Init ===
  minio-init:
    image: minio/mc
    profiles: ["minio"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set myminio http://minio:9000 $${MINIO_ACCESS_KEY:-minioadmin} $${MINIO_SECRET_KEY:-minioadmin}
        mc mb --ignore-existing myminio/aerial-survey
        mc anonymous set download myminio/aerial-survey/public
        mc anonymous set none myminio/aerial-survey/projects || true
        echo "MinIO bucket initialized successfully"
    environment:
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
    networks:
      - aerial-network

  # === TiTiler (COG Tile Server) ===
  titiler:
    image: ghcr.io/developmentseed/titiler:0.18.0
    environment:
      # CORS - allow all origins for development
      - TITILER_API_CORS_ORIGINS=*
      # MinIO/S3 configuration for GDAL /vsis3/ (used in minio mode)
      - AWS_ACCESS_KEY_ID=${MINIO_ACCESS_KEY:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - AWS_S3_ENDPOINT=minio:9000
      - AWS_VIRTUAL_HOSTING=FALSE
      - AWS_HTTPS=NO
      - AWS_NO_SIGN_REQUEST=NO
      # GDAL performance optimization
      - GDAL_DISABLE_READDIR_ON_OPEN=EMPTY_DIR
      - CPL_VSIL_CURL_ALLOWED_EXTENSIONS=.tif,.TIF,.tiff
      - VSI_CACHE=TRUE
      - VSI_CACHE_SIZE=50000000
      - CPL_VSIL_CURL_CACHE_SIZE=200000000
      - GDAL_HTTP_MAX_RETRY=5
      - CPL_VSIL_CURL_USE_HEAD=NO
    volumes:
      # 로컬 모드에서 file:// URL로 직접 읽기
      - ${EXPORT_ROOT_PATH:-${DATA_PATH:-./data}/storage/orthomosaic}:/data/storage/orthomosaic:ro
      - ${EXPORT_ROOT_PATH:-${DATA_PATH:-./data}/storage/orthomosaic}:/data/exports:ro
    networks:
      - aerial-network
    logging: *default-logging

  # === Nginx Reverse Proxy ===
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "${AERIAL_DEV_WEB_BIND:-127.0.0.1}:${AERIAL_DEV_WEB_PORT:-18110}:80"
      - "${AERIAL_DEV_HTTPS_BIND:-127.0.0.1}:${AERIAL_DEV_HTTPS_PORT:-18111}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ${TILES_PATH:-/data/tiles}:/data/tiles:ro  # 오프라인 타일맵
      - ${LOCAL_STORAGE_PATH:-${DATA_PATH:-./data}/storage}/projects:/data/storage/projects:ro  # 프로젝트 스토리지
      - ${EXPORT_ROOT_PATH:-${DATA_PATH:-./data}/storage/orthomosaic}:/data/storage/orthomosaic:ro  # 정사영상
      - ${EXPORT_ROOT_PATH:-${DATA_PATH:-./data}/storage/orthomosaic}:/data/exports:ro
    depends_on:
      - frontend
      - api
      - titiler
    networks:
      - aerial-network
    logging: *default-logging

  # === Flower (Celery Monitoring) ===
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.workers.tasks flower --port=5555
    user: "${AERIAL_CONTAINER_UID:-1000}:${AERIAL_CONTAINER_GID:-1000}"
    environment:
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "${AERIAL_DEV_FLOWER_BIND:-127.0.0.1}:${AERIAL_DEV_FLOWER_PORT:-18155}:5555"
    volumes:
      - ./backend:/app
    depends_on:
      - redis
    networks:
      - aerial-network
    logging: *default-logging

networks:
  aerial-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/16

volumes:
  pgdata:
  redis_data:
  engine-license:
